{% extends "base.html" %}
{% block title %}我的记录 - 发票管理系统{% endblock %}
{% block body %}
<header class="topbar">
  <span class="brand">发票管理系统</span>
  <span class="spacer"></span>
  <span id="me-info" class="muted"></span>
  <button id="btn-pass" class="btn">修改密码</button>
  <button id="btn-logout" class="btn">退出登录</button>
</header>
<main class="wrap">
  <section class="card">
    <h2>新增购买记录</h2>
    <form id="record-form" class="form-grid">
      <div class="field">
        <span class="field-label">商品名</span>
        <input name="product_name" required maxlength="200">
      </div>
      <div class="field">
        <span class="field-label">购买渠道</span>
        <select name="channel" id="channel-select">
          <option value="taobao">淘宝</option>
          <option value="jd">京东</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="field hidden" id="channel-note-field">
        <span class="field-label">渠道说明（必填）</span>
        <input name="channel_note" maxlength="100">
      </div>
      <div class="field">
        <span class="field-label">付款金额（元）</span>
        <input name="amount" type="number" min="0.01" step="0.01" required>
      </div>
      <div class="field">
        <span class="field-label">付款时间</span>
        <input name="paid_at" type="date" required>
      </div>
      <div class="field">
        <span class="field-label">付款人</span>
        <div class="radio-row">
          <label><input type="radio" name="payer" value="self" checked> 本人</label>
          <label><input type="radio" name="payer" value="tang"> 唐老师</label>
        </div>
      </div>
      <div class="field form-actions">
        <button type="submit" class="btn btn-primary">提交记录</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>我的记录</h2>
    <div class="table-scroll">
      <table class="data-table" id="records-table">
        <thead>
          <tr>
            <th>商品名</th><th>渠道</th><th>金额(元)</th><th>付款时间</th>
            <th>付款人</th><th>状态</th><th>发票</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="records-empty" class="muted hidden">暂无记录</p>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/user.js') }}"></script>{% endblock %}
