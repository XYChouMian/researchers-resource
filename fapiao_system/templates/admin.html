{% extends "base.html" %}
{% set nav_active = 'admin' %}
{% block title %}后台管理 - 发票管理系统{% endblock %}
{% block body %}
{% include "_topbar.html" %}
<main class="wrap">
  <section class="card">
    <div class="card-head">
      <h2>用户管理</h2>
      <form id="user-form" class="toolbar">
        <a href="logs" class="btn">查看系统日志</a>
        <input name="student_id" placeholder="学号" required pattern="[A-Za-z0-9]{3,20}" title="3~20 位字母或数字">
        <input name="name" placeholder="姓名（可选）">
        <select name="role">
          <option value="user">用户</option>
          <option value="admin">管理员</option>
        </select>
        <button type="submit" class="btn btn-primary">添加用户</button>
      </form>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="users-table">
        <thead>
          <tr>
            <th>学号</th><th>姓名</th><th>角色</th>
            <th>购买记录数</th><th>未处理</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin.js') }}"></script>{% endblock %}
