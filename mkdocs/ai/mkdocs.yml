# 1. 网站基础设置
site_name: AI 技术学习 # 改成你喜欢的名字
site_author: xychoumian
site_url: http://expfluid.bond/ # 以后绑定域名用

# 2. 主题设置 (使用超漂亮的 Material 主题)
theme:
  name: material
  language: zh # 网页语言设为中文
  features:
    - navigation.tabs # 顶部导航条
    - navigation.sections # 侧边栏分组折叠
    - navigation.top # 回到顶部按钮
    - search.suggest # 搜索自动补全
    - search.highlight # 搜索关键词高亮
  palette:
    # 日间模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal # 主色调（蓝绿色）
      accent: indigo # 辅助色
      toggle:
        icon: material/weather-sunny
        name: 切换到暗黑模式
    # 暗黑模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到日间模式

